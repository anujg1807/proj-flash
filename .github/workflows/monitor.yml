name: Anthropic PM Job Monitor

on:
  schedule:
    - cron: "0 * * * *"   # hourly fallback (primary trigger is cron-job.org via workflow_dispatch)
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: write           # needed to commit known_jobs.json

# The cron-job.org dispatch and the hourly GitHub schedule can fire in the same
# minute. Two runs then race on `git push` and the loser fails the whole workflow.
# Serialise instead of cancelling — a cancelled run would skip its Telegram alerts.
concurrency:
  group: pm-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper.py

      - name: Commit updated known_jobs.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add known_jobs.json
          # Only commit if there are actual changes
          git diff --cached --quiet && echo "no state change; nothing to push" && exit 0
          git commit -m "chore: update known_jobs.json [skip ci]"
          # Concurrency above should prevent races, but a stale checkout can still
          # lose to a push that landed mid-run. Rebase and retry rather than fail.
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $i) — rebasing on origin/main"
            git pull --rebase origin main || exit 1
          done
          echo "push failed after 3 attempts" && exit 1

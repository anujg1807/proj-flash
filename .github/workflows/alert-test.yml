name: PM Alert Test (manual)

# Manual test: alerts on every open PM role at one company, ignoring known_jobs.json.
# Does not touch state, so it cannot suppress the real monitor. Safe to delete.

on:
  workflow_dispatch:
    inputs:
      company:
        description: "Company to test (Airbnb, Anthropic, Atlassian, Google, Netflix, OpenAI, Perplexity)"
        required: true
        default: "Airbnb"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send PM alerts for ${{ inputs.company }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMPANY: ${{ inputs.company }}
        run: python test_company_alert.py
